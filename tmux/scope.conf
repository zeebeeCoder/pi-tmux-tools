# Scope indicator for pi-tmux-continuity scoped servers (`tmux -L <scope>`).
# Source this LAST from tmux.conf. The default server (socket named "default") is unchanged.
# Reload-safe: the block is prepended only when not already present.
if-shell -F '#{!=:#{b:socket_path},default}' {
  set -gF @scope-name '#{b:socket_path}'
  if-shell -F '#{!:#{m:*@scope-name*,#{status-left}}}' {
    set -gF status-left '#[fg=#282828,bg=#fe8019,bold] ##{@scope-name} #[default]#{status-left}'
  }
  if-shell -F '#{!:#{m:*@scope-name*,#{set-titles-string}}}' {
    set -gF set-titles-string '[##{@scope-name}] #{set-titles-string}'
  }
  # Autosave (throttled to five minutes by the CLI) while a client shows the status line.
  # @scope-cli is set by `scope open`; servers started otherwise never autosave.
  if-shell -F '#{!:#{m:*scope-cli*,#{status-right}}}' {
    set -ag status-right '#{?@scope-cli,#(#{@scope-cli} autosave #{@scope-name}),}'
  }
}
