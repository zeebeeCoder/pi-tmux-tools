# Managed workspaces for pi-tmux-continuity. Source this LAST from tmux.conf, once.
# Every server gets the same recovery behaviour; only presentation differs:
#   - non-default servers (`tmux -L acme`) show the workspace name in the status bar and title;
#     the default server shows nothing extra.
#   - prefix C-s saves and, the first time, adopts the server as a managed workspace.
#   - managed workspaces also save on detach and every five minutes from the status line, and
#     are restored, agents included, when their server starts (once per start; start with
#     PI_TMUX_SCOPE_FRESH=1 in the environment to skip). Unmanaged servers are left alone.
# Guards use #{?x,0,1}: tmux 3.5 has no #{!:x}.
set -gF @scope-name '#{b:socket_path}'
set -gF @scope-bin '#{d:current_file}/../bin/tmux-scope.js'
if-shell -F '#{?#{m:*@scope-bin*,#{status-left}},0,1}' {
  # Invisible: prints nothing. Triggers the throttled autosave whenever the status line redraws.
  set -gF status-left '##("##{@scope-bin}" autosave "##{socket_path}")#{status-left}'
}
if-shell -F '#{!=:#{b:socket_path},default}' {
  if-shell -F '#{?#{m:*@scope-name*,#{status-left}},0,1}' {
    set -gF status-left '#[fg=#282828,bg=#fe8019,bold] ##{@scope-name}##{?@scope-degraded, !,} #[default]#{status-left}'
  }
  if-shell -F '#{?#{m:*@scope-name*,#{set-titles-string}},0,1}' {
    set -gF set-titles-string '[##{@scope-name}] #{set-titles-string}'
  }
}
bind C-s run-shell -b '"#{@scope-bin}" save "#{socket_path}"'
set-hook -g client-detached 'run-shell -b "\"#{@scope-bin}\" detach \"#{socket_path}\""'
# Once per server start, never on reload. The flag also blocks saving until restore ends.
if-shell -F '#{?@scope-started,0,1}' {
  set -g @scope-started 1
  set -g @scope-restoring 1
  run-shell -b '"#{@scope-bin}" restore "#{socket_path}"'
}
