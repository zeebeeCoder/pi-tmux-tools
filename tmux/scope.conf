# Scopes for pi-tmux-continuity: every non-default server (`tmux -L <name>`) is a scope.
# Source this LAST from tmux.conf, once. Nothing changes on the default server.
#   - status bar and title show the scope name (reload-safe)
#   - autosave every five minutes from the status line, on detach, and with prefix C-s
#   - on server start, the scope's last save is restored, agents included (once per start;
#     start with PI_TMUX_SCOPE_FRESH=1 in the environment to skip it)
if-shell -F '#{!=:#{b:socket_path},default}' {
  set -gF @scope-name '#{b:socket_path}'
  set -gF @scope-bin '#{d:current_file}/../bin/tmux-scope.js'
  # The scope block also carries the (invisible) autosave, so one reload-safe check covers both.
  if-shell -F '#{?#{m:*@scope-name*,#{status-left}},0,1}' {
    set -gF status-left '#[fg=#282828,bg=#fe8019,bold] ##{@scope-name} #[default]##(##{@scope-bin} autosave ##{socket_path})#{status-left}'
  }
  if-shell -F '#{?#{m:*@scope-name*,#{set-titles-string}},0,1}' {
    set -gF set-titles-string '[##{@scope-name}] #{set-titles-string}'
  }
  bind C-s run-shell -b '#{@scope-bin} save #{socket_path}'
  set-hook -g client-detached 'run-shell -b "#{@scope-bin} save #{socket_path}"'
  # Once per server start, never on reload. The flag also blocks saving until restore ends.
  if-shell -F '#{?@scope-started,0,1}' {
    set -g @scope-started 1
    set -g @scope-restoring 1
    run-shell -b '#{@scope-bin} restore #{socket_path}'
  }
}
